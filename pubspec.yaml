name: coachboard
description: CoachBoard — Offline board for independent PTs.

publish_to: "none"

version: 1.0.1+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.3
  in_app_purchase: ^3.2.1
  http: ^1.2.2
  intl: ^0.20.2
  share_plus: ^10.1.4
  pdf: ^3.11.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo_padded.png
  adaptive_icon_background: "#0A0E0C"
  adaptive_icon_foreground: assets/logo_padded.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_padded.png
